{{define "content"}}
<div class="card">
  <header class="card-head">
    <h1>{{T "portal.title"}}</h1>
    <p class="muted">{{T "portal.subtitle"}}</p>
  </header>
  <p class="muted">{{T "portal.stub"}}</p>
  <div class="portal-actions">
    {{if .User}}
    <a class="btn-primary" href="/dashboard">{{T "portal.to_admin"}}</a>
    {{else}}
    <a class="btn-primary" href="/login?next=%2Fdashboard">{{T "login.submit"}}</a>
    {{end}}
  </div>
</div>
{{end}}
