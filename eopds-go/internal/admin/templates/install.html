{{define "content"}}
<div class="card card-narrow">
  <header class="card-head">
    <h1>{{T "install.title"}}</h1>
    <p class="muted">{{T "install.subtitle"}}</p>
  </header>

  {{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}

  <form method="post" action="/install" autocomplete="off">
    <fieldset>
      <legend>{{T "install.db.legend"}}</legend>

      <div class="db-hint">
        <p class="db-hint-title">{{T "db.hint_title"}}</p>
        <p><strong>PostgreSQL.</strong> {{T "db.hint_pg"}}</p>
        <p><strong>SQLite.</strong> {{T "db.hint_sqlite"}}</p>
      </div>

      <label class="row"><span>{{T "install.db.type"}}</span>
        <select name="db_type" id="db_type" onchange="toggleDB()">
          <option value="postgres" {{if eq .DBType "postgres"}}selected{{end}}>{{T "db.opt_postgres"}}</option>
          <option value="sqlite" {{if eq .DBType "sqlite"}}selected{{end}}>{{T "db.opt_sqlite"}}</option>
        </select>
      </label>

      <div id="pg-fields">
        <label class="row"><span>{{T "install.db.host"}}</span>
          <input name="db_host" value="{{.DBHost}}" placeholder="localhost"></label>
        <label class="row"><span>{{T "install.db.port"}}</span>
          <input name="db_port" value="{{.DBPort}}" inputmode="numeric" placeholder="5432"></label>
        <label class="row"><span>{{T "install.db.name"}}</span>
          <input name="db_name" value="{{.DBName}}" placeholder="eopds"></label>
        <label class="row"><span>{{T "install.db.user"}}</span>
          <input name="db_user" value="{{.DBUser}}" placeholder="eopds"></label>
        <label class="row"><span>{{T "install.db.password"}}</span>
          <input name="db_password" type="password" autocomplete="new-password"></label>
      </div>

      <div id="sqlite-fields" style="display:none">
        <label class="row"><span>{{T "install.db.path"}}</span>
          <input name="db_path" value="{{.DBPath}}" placeholder="/config/eopds.db"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>{{T "install.admin.legend"}}</legend>
      <label class="row"><span>{{T "install.admin.username"}}</span>
        <input name="username" value="{{.Username}}" required minlength="3" placeholder="admin"></label>
      <label class="row"><span>{{T "install.admin.email"}}</span>
        <input name="email" type="email" value="{{.Email}}" placeholder="admin@example.com"></label>
      <label class="row"><span>{{T "install.admin.password"}}</span>
        <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <label class="row"><span>{{T "install.admin.password2"}}</span>
        <input name="password2" type="password" required minlength="8" autocomplete="new-password"></label>
    </fieldset>

    <button type="submit" class="btn-primary">{{T "install.submit"}}</button>
  </form>
</div>

<script>
  function toggleDB() {
    var t = document.getElementById('db_type').value;
    document.getElementById('pg-fields').style.display = (t === 'postgres') ? '' : 'none';
    document.getElementById('sqlite-fields').style.display = (t === 'sqlite') ? '' : 'none';
  }
  toggleDB();
</script>
{{end}}
