{{define "content"}}
<div class="card">
  <table class="table lib-index">
    {{range .Items}}
    <tr>
      <td><a class="book-title" href="/library/books?genre={{.ID}}">{{.Title}}</a></td>
      <td style="text-align:right;"><span class="muted">{{.Count}} {{T "lib.books_n"}}</span></td>
    </tr>
    {{else}}
    <tr><td><p class="muted">{{T "lib.empty"}}</p></td></tr>
    {{end}}
  </table>
  {{template "lib_pager" .Pagination}}
</div>
{{end}}
