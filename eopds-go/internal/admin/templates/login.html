{{define "content"}}
<div class="card card-narrow">
  <header class="card-head">
    <h1>{{T "login.title"}}</h1>
    <p class="muted">{{T "app.name"}}</p>
  </header>
  {{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="next" value="{{.Next}}">
    <label class="row"><span>{{T "login.username"}}</span>
      <input name="username" value="{{.Username}}" required autofocus></label>
    <label class="row"><span>{{T "login.password"}}</span>
      <span class="pw-wrap">
        <input id="login-password" name="password" type="password" required autocomplete="current-password">
        <button type="button" class="pw-toggle" id="pw-toggle"
                aria-label="{{T "login.show_password"}}" aria-pressed="false"
                data-hide-label="{{T "login.hide_password"}}"
                title="{{T "login.show_password"}}">
          <svg class="ico-eye" viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="ico-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.6 10.6 0 0 1 12 19.5C5 19.5 1.5 12 1.5 12a19.7 19.7 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A10.5 10.5 0 0 1 12 4.5c7 0 10.5 7.5 10.5 7.5a19.8 19.8 0 0 1-3.22 4.24"/>
            <path d="M9.88 9.88a3 3 0 0 0 4.24 4.24"/>
            <line x1="2" y1="2" x2="22" y2="22"/>
          </svg>
        </button>
      </span>
    </label>
    <button type="submit" class="btn-primary">{{T "login.submit"}}</button>
  </form>
</div>
<script>
(function () {
  var pwd = document.getElementById('login-password');
  var btn = document.getElementById('pw-toggle');
  if (!pwd || !btn) return;
  var labelShow = btn.getAttribute('aria-label');
  var labelHide = btn.getAttribute('data-hide-label') || labelShow;
  btn.addEventListener('click', function () {
    var show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    btn.classList.toggle('is-active', show);
    var lbl = show ? labelHide : labelShow;
    btn.setAttribute('aria-label', lbl);
    btn.setAttribute('title', lbl);
    pwd.focus();
  });
})();
</script>
{{end}}
