{{define "content"}}
<div class="card card-narrow">
  <header class="card-head">
    <h1>{{T "login.title"}}</h1>
    <p class="muted">{{T "app.name"}}</p>
  </header>
  {{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="next" value="{{.Next}}">
    <label class="row"><span>{{T "login.username"}}</span>
      <input name="username" value="{{.Username}}" required autofocus></label>
    <label class="row"><span>{{T "login.password"}}</span>
      <input name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit" class="btn-primary">{{T "login.submit"}}</button>
  </form>
</div>
{{end}}
